[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-pit"
version = "0.1.0"
description = "Append-only point-in-time macroeconomic data store"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "click>=8.1.7",
  "duckdb>=0.10.0",
  "httpx>=0.27.0",
  "lxml>=5.1.0",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
  "pandas>=2.0.0",
  "polars>=0.20.0",
  "pyarrow>=15.0.0",
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
]

[project.scripts]
macro-pit = "macro_pit.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"
