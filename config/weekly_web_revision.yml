version: 1
run_mode: weekly_revision

# Weekly China revision audit: latest three pages and the PBOC robots-policy probe.
sources:
  NBS:
    enabled: true
    index_manifests:
      - config/daily_nbs_index_urls.txt
    recheck_latest: 3
    max_candidates_per_run: 20
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
  PBOC:
    enabled: true
    index_manifests:
      - config/pboc_index_urls.txt
    recheck_latest: 3
    max_candidates_per_run: 20
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
    policy_blocked: true
    policy_probe: true
  PBOC_MIRROR:
    enabled: true
    index_manifests:
      - config/pboc_mirror_index_urls.txt
    recheck_latest: 3
    max_candidates_per_run: 10
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
    bootstrap_existing_as_baseline: true
    independent_indexes: true
    independent_candidates: true
  CUSTOMS:
    enabled: false
    index_manifests:
      - config/customs_english_index_urls.txt
    # Weekly audit broadens the same official-only revision scan.
    recheck_latest: 36
    max_candidates_per_run: 40
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
    bootstrap_existing_as_baseline: false
    independent_indexes: true
    independent_candidates: true
    # Keep the batch healthy while the official CDN serves an unverifiable TLS chain.
    transport_soft_block: true
  MOF:
    enabled: true
    index_manifests:
      - config/daily_mof_index_urls.txt
    recheck_latest: 3
    max_candidates_per_run: 20
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
    bootstrap_existing_as_baseline: true
  SAFE:
    enabled: true
    index_manifests:
      - config/daily_safe_index_urls.txt
    recheck_latest: 3
    max_candidates_per_run: 20
    retry_backoff_days: [1, 3, 7]
    not_found_cooldown_days: 30
  OECD:
    enabled: true
    job_manifest: config/oecd_china_core.yml
    recent_lookback_months: 0
    skip_unchanged_fetch: false

state_path: data/daily_web_update/state.json
lock_path: data/daily_web_update/run.lock
report_dir: reports/v2/weekly_web_revision
logs_dir: logs/weekly_web_revision

semantic_audit:
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  max_candidates: 50
  max_excerpt_chars: 1400
  max_output_tokens: 6000
  timeout_seconds: 180
  api_attempts: 2
  report_dir: reports/v2/deepseek_weekly_audit/china

email_notification:
  enabled: true
  recipient: 718711226@qq.com
  label: China weekly revision
  config_file: emailconfig.ini
  timeout_seconds: 60
  report_dir: reports/v2/email_delivery/china_weekly
