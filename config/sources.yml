network:
  # Network access is opt-in at the CLI. Discovery, parsing, audit and tests are
  # offline by default.
  enabled_by_default: false
  user_agent: "macro-pit-research/0.1 (read-only; single-threaded)"
  connect_timeout_seconds: 15
  read_timeout_seconds: 45
  respect_robots_txt: true
  stop_on_robots_error: true
  cache_first: true

defaults:
  concurrency: 1
  min_interval_seconds: 20
  jitter_seconds: 10
  max_requests_per_run: 100
  max_requests_per_day: 200
  max_consecutive_failures: 3
  max_retries: 2
  retry_backoff_seconds: 60
  block_statuses: [401, 403, 407, 429]

sources:
  NBS:
    country: CN
    base_url: "https://data.stats.gov.cn"
    # api.so-gov.cn is the search backend referenced by the official NBS
    # search page.  It is used only for bounded legacy release discovery.
    allowed_hosts: ["data.stats.gov.cn", "www.stats.gov.cn", "api.so-gov.cn"]
    min_interval_seconds: 75
    jitter_seconds: 30
    # The candidate queue is finite and reviewed. Keep polite pacing and all
    # safety circuit breakers, but allow one background pass to drain it.
    # null disables count ceilings; pacing, robots and circuit breakers remain.
    max_requests_per_run: null
    max_requests_per_day: null
  PBOC:
    country: CN
    base_url: "http://www.pbc.gov.cn"
    allowed_hosts: ["www.pbc.gov.cn", "pbc.gov.cn"]
    min_interval_seconds: 45
    jitter_seconds: 20
    max_requests_per_run: null
    max_requests_per_day: null
  PBOC_MIRROR:
    country: CN
    base_url: "https://jrj.sh.gov.cn"
    allowed_hosts: ["jrj.sh.gov.cn", "jr.jl.gov.cn", "jrb.qingdao.gov.cn"]
    min_interval_seconds: 45
    jitter_seconds: 20
    max_requests_per_run: 30
    max_requests_per_day: 60
  CUSTOMS:
    country: CN
    base_url: "http://www.customs.gov.cn"
    allowed_hosts: ["www.customs.gov.cn", "customs.gov.cn", "english.customs.gov.cn"]
    min_interval_seconds: 60
    jitter_seconds: 30
    max_requests_per_run: 50
    max_requests_per_day: 100
  MOF:
    country: CN
    base_url: "https://www.mof.gov.cn"
    allowed_hosts: ["www.mof.gov.cn", "mof.gov.cn", "gks.mof.gov.cn"]
    min_interval_seconds: 75
    jitter_seconds: 30
    # Leave room for the required robots.txt check plus 50 release pages.
    max_requests_per_run: 55
    max_requests_per_day: 80
  SAFE:
    country: CN
    base_url: "https://www.safe.gov.cn"
    allowed_hosts: ["www.safe.gov.cn", "safe.gov.cn"]
    min_interval_seconds: 45
    jitter_seconds: 20
    max_requests_per_run: null
    max_requests_per_day: null
  SINA_MACRO:
    country: CN
    base_url: "https://quotes.sina.cn"
    allowed_hosts: ["quotes.sina.cn"]
    min_interval_seconds: 2
    jitter_seconds: 1
    max_requests_per_run: 20
    max_requests_per_day: 100

  EASTMONEY_MACRO:
    country: CN
    base_url: "https://datacenter-web.eastmoney.com"
    allowed_hosts: ["datacenter-web.eastmoney.com"]
    min_interval_seconds: 2
    jitter_seconds: 1
    max_requests_per_run: 10
    max_requests_per_day: 20

  RTDSM:
    country: US
    base_url: "https://www.philadelphiafed.org"
    allowed_hosts: ["www.philadelphiafed.org", "philadelphiafed.org"]
    min_interval_seconds: 15
    jitter_seconds: 10
    max_requests_per_run: 20
    # Daily and weekly runs share the same Shanghai-date ledger (16 + 16 requests).
    max_requests_per_day: 40
  OECD:
    country: GLOBAL
    base_url: "https://sdmx.oecd.org"
    allowed_hosts: ["sdmx.oecd.org"]
    min_interval_seconds: 10
    jitter_seconds: 5
    max_requests_per_run: 30
    # Retry temporary robots fetch failures, never an explicit disallow/4xx.
    robots_retries: 2
    robots_retry_backoff_seconds: 5
    # Allow China daily plus global daily and weekly audits on the same day.
    max_requests_per_day: 120

  CHINABOND:
    country: CN
    base_url: "https://yield.chinabond.com.cn"
    allowed_hosts: ["yield.chinabond.com.cn"]
    # User-authorized 2026-09-16: continue only when robots.txt cannot be
    # retrieved; an explicit Disallow response still blocks the request.
    stop_on_robots_error: false
    min_interval_seconds: 3
    jitter_seconds: 2
    max_requests_per_run: 30
    max_requests_per_day: 80
  USTREASURY:
    country: US
    base_url: "https://home.treasury.gov"
    allowed_hosts: ["home.treasury.gov"]
    min_interval_seconds: 2
    jitter_seconds: 1
    max_requests_per_run: 30
    max_requests_per_day: 80

  IMF:
    country: GLOBAL
    base_url: "https://www.imf.org"
    allowed_hosts: ["www.imf.org", "imf.org"]
    min_interval_seconds: 5
    jitter_seconds: 2
    max_requests_per_run: 3
    max_requests_per_day: 20
